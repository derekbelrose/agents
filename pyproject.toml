[project]
name = "ai-agents"
version = "0.0.0"
description = "Test-first specification for the Nix-packaged agent toolkit"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["agents/research/src"]
testpaths = ["tests"]
markers = [
  "milestone1: repository and Nix foundation",
  "milestone2: research-agent executable protocol",
  "milestone3: OpenAI-compatible model client",
  "milestone4: independently executable web search tool",
  "milestone5: model-directed tool calling and iteration limits",
  "milestone6: structured research output and provenance",
  "milestone7: Codex-facing usage documentation",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
